<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú y Formulario</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f2f2f2;
            margin:0;
        }

        header{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            overflow:hidden;
        }

        nav a{
            float:left;
            color:white;
            text-decoration:none;
            padding:14px 20px;
        }

        nav a:hover{
            background:#0d6efd;
        }

        .contenedor{
            width:400px;
            margin:40px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
            box-sizing:border-box;
        }

        input[type="submit"]{
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
        }

        input[type="submit"]:hover{
            background:#084298;
        }

        footer{
            text-align:center;
            background:#333;
            color:white;
            padding:15px;
            margin-top:40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Sistema de Registro</h1>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Usuarios</a>
    <a href="#">Servicios</a>
    <a href="#">Contacto</a>
</nav>

<div class="contenedor">

    <h2>Formulario de Registro</h2>

    <form>

        <label>Nombre</label>
        <input type="text" placeholder="Ingrese su nombre">

        <label>Apellido</label>
        <input type="text" placeholder="Ingrese su apellido">

        <label>Correo</label>
        <input type="email" placeholder="Ingrese su correo">

        <label>Teléfonos</label>
        <input type="text" placeholder="Ingrese su teléfono">

        <input type="submit" value="Registrar">

    </form>

</div>

<footer>
    © 2026 - Práctica HTML | Menú y Formulario
</footer>

</body>
</html>
